<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log-In</title>
    <link rel="stylesheet" href="/src/output.css" />
  </head>
  <body>
    <div class="flex space-x-4 pt-40 items-center justify-center">
      <div class="logo w-18">
        <img src="images/green-logo.png" class="" />
      </div>
      <div class="heading font-bold">
        <a href="#" class="text-7xl font-display text-grayOk">Recovery.com</a>
      </div>
    </div>
    <div
      class="flex items-center font-mainm py-20 text-gray-900 pb-80 justify-center bg-mintOk"
    >
      <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold text-grayOk text-center mb-6">
          Login to Your Account
        </h2>
        <form class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input
              type="email"
              class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="you@example.com"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700"
              >Password</label
            >
            <input
              type="password"
              class="w-full mt-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="••••••••"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full bg-mintOk text-grayOk py-2 px-4 rounded-md hover:bg- transition duration-300"
          >
            <a href="/src/login.html">Log In</a>
          </button>
        </form>
        <p class="mt-4 text-center text-sm text-grayOk">
          Don’t have an account?
          <a href="#" class="text-blue-500 hover:underline">Sign up</a>
        </p>
      </div>
    </div>
  </body>
</html>
